name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s workers/rag_worker/tests
      - name: Verify database bootstrap
        run: |
          cp .env.example .env
          docker compose up -d --wait
          docker compose exec -T postgres psql -U rag_local -d rag_platform -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"
      - name: Apply migrations twice
        env:
          RAG_MIGRATIONS_DATABASE: Host=localhost;Port=5432;Database=rag_platform;Username=rag_local;Password=change-this-local-password
        run: |
          dotnet run --project src/RagPlatform.Migrations
          dotnet run --project src/RagPlatform.Migrations
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U rag_local -d rag_platform < tests/database/document_model.sql
          bash tests/database/migration_runner.sh
      - name: Test API and database integration
        env:
          RAG_TEST_DATABASE: Host=localhost;Port=5432;Database=rag_platform;Username=rag_local;Password=change-this-local-password
        run: dotnet test tests/RagPlatform.Tests/RagPlatform.Tests.csproj
      - if: always()
        run: docker compose down
